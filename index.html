    <script>

    'XLY': { name: 'CONSUMER DISCRETIONARY SELT', price: '184.60 USD', score: '-0.1980', verdict: 'Bearish', text: `Consumer Discretionary Select Sector SPDR targets broad retail, automotive, and leisure industries. Shifting consumer discretionary expenditure lines across secondary geographic hubs introduce macro demand fluctuations.` },
    'XLP': { name: 'CONSUMER STAPLES SPDR', price: '75.40 USD', score: '+0.0120', verdict: 'Neutral', text: `Consumer Staples Select Sector SPDR holds defensive packaging, food products, and household goods providers. Highly stable consumer merchandise retail baselines protect absolute corporate margin structures.` },
    'XLE': { name: 'ENERGY SELECT SECTOR SPDR', price: '88.10 USD', score: '-0.3410', verdict: 'Bearish', text: `Energy Select Sector SPDR Fund tracks integrated oil, gas, and energy equipment operators. Softer global refining margins and fluctuating crude baselines create short-term cash flow contractions across legacy asset grids.` },

    'GRID': { name: 'FIRST TRST NASD CL EDG SGIIF', price: '124.15 USD', score: '+0.1140', verdict: 'Neutral', text: `First Trust NASDAQ Clean Edge Smart Grid Infrastructure ETF tracks smart grid tech. Widespread electric utilities grid transformation runs in tandem with massive macro capital allocations.` },

    'INDA': { name: 'ISHARES MSCI INDIA ETF', price: '48.20 USD', score: '+0.3180', verdict: 'Bullish', text: `iShares MSCI India ETF tracks broad Indian equities. Massive retail customer acquisition across tier-2 cities and rapid independent infrastructure rollouts balance regional legacy commodity risks.` },
    'EWZ': { name: 'ISHARES MSCI BRAZIL ETF', price: '28.50 USD', score: '-0.2150', verdict: 'Bearish', text: `iShares MSCI Brazil ETF targets integrated South American commodity and banking sectors. Fluctuating global material demand lines introduce short-term margin volatility across integrated corporate networks.` },
    'SPY': { name: 'SPDR S&P 500 ETF TRUST', price: '512.40 USD', score: '+0.1450', verdict: 'Neutral', text: `SPDR S&P 500 ETF Trust tracks the core broad market capitalization index of the top 500 liquid US corporate entities, acting as an institutional baseline asset allocation wrapper.` },

        function switchAsset(ticker) {
            const data = PORTFOLIO_DATA[ticker];
            if (!data) return;
            document.getElementById('current-ticker').innerText = ticker;
            document.getElementById('current-name').innerText = data.name;
            document.getElementById('current-price').innerText = data.price;

            const scoreElement = document.getElementById('current-score');
            const badgeElement = document.getElementById('current-verdict-badge');
            scoreElement.innerText = data.score;

            if (data.verdict === "Bullish") {
                scoreElement.className = "text-xl font-bold mt-1 text-emerald-400";
                badgeElement.className = "px-2.5 py-1 text-xs font-semibold rounded-full text-emerald-400 border border-emerald-800 bg-emerald-950/20";
                badgeElement.innerText = "✅ Bullish";
            } else if (data.verdict === "Bearish") {
                scoreElement.className = "text-xl font-bold mt-1 text-rose-400";
                badgeElement.className = "px-2.5 py-1 text-xs font-semibold rounded-full text-rose-400 border border-rose-800 bg-rose-950/20";
                badgeElement.innerText = "❌ Bearish";
            } else {
                scoreElement.className = "text-xl font-bold mt-1 text-amber-400";
                badgeElement.className = "px-2.5 py-1 text-xs font-semibold rounded-full text-amber-400 border border-amber-800 bg-amber-950/20";
                badgeElement.innerText = "⚫ Neutral";
            }
            document.getElementById('current-text').innerText = data.text;

            document.querySelectorAll('.ticker-btn').forEach(btn => {
                btn.className = "ticker-btn p-2 text-center rounded border border-zinc-800 bg-zinc-900/40 text-zinc-400 text-[10px] font-mono hover:border-zinc-700 transition-all truncate";
            });
            const cleanId = 'btn-' + ticker.replace('.', '\.');
            const targetBtn = document.getElementById(cleanId);
            if(targetBtn) {
                targetBtn.className = "ticker-btn p-2 text-center rounded border border-amber-500 bg-zinc-900 text-white text-[10px] font-mono shadow-md shadow-amber-500/5 font-bold truncate";
            }
        }
        window.onload = function() {
            switchAsset('MSOS');
        };
